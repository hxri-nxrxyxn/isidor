    <style>
        :root {
            --bg-color: #ffffff;
            --main-red: #ff0000;
            --secondary-text: rgba(0, 0, 0, 0.4);
            --hover-black: #000000;
            --font-family: 'Cascadia Mono', monospace;
            --transition-speed: 1.2s;
            --transition-easing: cubic-bezier(0.85, 0, 0.15, 1);
            --hover-speed: 0.3s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            font-family: var(--font-family);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        /* Accessibility: Skip to main content (if needed for larger sites) */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        /* Loading Screen */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: transform var(--transition-speed) var(--transition-easing);
            will-change: transform;
        }

        #loader img {
            width: 97px;
            height: 96px;
            animation: spin 4s cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        body.loaded #loader {
            transform: translateY(-100%);
        }

        /* Main Content */
        #main-content {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease, transform 1s var(--transition-easing);
            transition-delay: 0.3s;
            will-change: opacity, transform;
        }

        body.loaded #main-content {
            opacity: 1;
            transform: translateY(0);
        }

        .main-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            transform: translateY(-20px);
        }

        .logo-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-img {
            display: block;
            width: min(90vw, 440px); /* Fluid width that caps at 440px */
            height: auto;
            transition: opacity var(--hover-speed) ease;
            cursor: pointer;
        }

        .logo-img:hover {
            opacity: 0.8;
        }

        .subtitle {
            font-size: clamp(0.55rem, 1.2vw, 0.75rem); /* Fluid font size */
            color: var(--secondary-text);
            text-transform: uppercase;
            letter-spacing: 0.35rem;
            font-weight: 600;
            margin-top: -1.4rem;
            display: flex;
            gap: clamp(1rem, 5vw, 2.5rem); /* Fluid gap */
            width: 100%;
            justify-content: center;
            cursor: default;
        }

        .subtitle span {
            transition: color var(--hover-speed) ease;
        }

        .subtitle span:hover {
            color: var(--hover-black);
        }

        footer {
            position: absolute;
            bottom: 3rem;
            left: 3rem;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            color: var(--secondary-text);
            font-size: clamp(0.6rem, 1vw, 0.7rem);
            letter-spacing: 0.2rem;
            font-weight: 600;
        }

        .footer-item {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .footer-link {
            color: inherit;
            text-decoration: none;
            display: flex;
            align-items: center;
            transition: color var(--hover-speed) ease;
            outline: none;
        }

        .footer-link:focus-visible {
            color: var(--hover-black);
            text-decoration: underline;
        }

        .footer-link:hover {
            color: var(--hover-black);
        }

        .icon {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            pointer-events: none;
        }

        /* Responsive Design Pass */
        @media (max-width: 600px) {
            .main-container {
                padding: 0 1.5rem;
            }
            .subtitle { 
                margin-top: -0.8rem;
                letter-spacing: 0.25rem;
            }
            footer { 
                bottom: 2rem; 
                left: 0;
                width: 100%;
                padding: 0 1.5rem;
                flex-direction: column; 
                align-items: center; 
                text-align: center;
            }
            .footer-item {
                flex-direction: column;
                gap: 1.2rem;
            }
            .footer-link {
                padding: 0.5rem 0;
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body class="loading">

    <script>
        // Optimization: Use DOMContentLoaded for initial logic, but wait for 'load' for the transition
        document.addEventListener('DOMContentLoaded', () => {
            // Pre-calculate anything if needed
        });

        window.addEventListener('load', () => {
            // 3-second deliberate delay for brand impact as requested
            setTimeout(() => {
                document.body.classList.remove('loading');
                document.body.classList.add('loaded');
            }, 3000);
        });
    </script>

</body>
